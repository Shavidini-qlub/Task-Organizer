<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My Tasks</title>
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#EEF0F4;
    --border:#DFE3EA;
    --text:#161A20;
    --text-muted:#666E7A;
    --text-faint:#98A0AC;
    --accent:#0E6E6B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1F1F0;
    --warn:#B4740E;
    --warn-soft:#FBEFDD;
    --medium:#A38B00;
    --medium-soft:#FBF6D3;
    --good:#1E8E5A;
    --good-soft:#E3F5EC;
    --danger:#C33A3A;
    --danger-soft:#FBEAEA;
    --personal:#8B5CC7;
    --personal-soft:#F1E9FA;
    --shadow:0 1px 2px rgba(20,24,28,0.04), 0 8px 24px -12px rgba(20,24,28,0.10);
    --radius:14px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1215; --surface:#171B1F; --surface-2:#1D2227; --border:#2A3038;
      --text:#EDEFF2; --text-muted:#9AA2AC; --text-faint:#666E76;
      --accent:#3FCFC8; --accent-ink:#08201F; --accent-soft:rgba(63,207,200,0.14);
      --warn:#E3A33E; --warn-soft:rgba(227,163,62,0.14);
      --medium:#E8D24A; --medium-soft:rgba(232,210,74,0.16);
      --good:#3FCB84; --good-soft:rgba(63,203,132,0.14);
      --danger:#E5726A; --danger-soft:rgba(229,114,106,0.14);
      --personal:#B695E0; --personal-soft:rgba(182,149,224,0.16);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1215; --surface:#171B1F; --surface-2:#1D2227; --border:#2A3038;
    --text:#EDEFF2; --text-muted:#9AA2AC; --text-faint:#666E76;
    --accent:#3FCFC8; --accent-ink:#08201F; --accent-soft:rgba(63,207,200,0.14);
    --warn:#E3A33E; --warn-soft:rgba(227,163,62,0.14);
    --medium:#E8D24A; --medium-soft:rgba(232,210,74,0.16);
    --good:#3FCB84; --good-soft:rgba(63,203,132,0.14);
    --danger:#E5726A; --danger-soft:rgba(229,114,106,0.14);
    --personal:#B695E0; --personal-soft:rgba(182,149,224,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding:0 20px;
    padding-block:28px 60px;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:18px; }

  /* ---- header ---- */
  header{ display:flex; flex-direction:column; gap:14px; }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:30px; margin:0;
    letter-spacing:-0.01em; text-wrap:balance;
  }
  .brand .today{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); letter-spacing:0.02em; }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; display:flex; align-items:baseline; gap:7px; box-shadow:var(--shadow);
    flex:1 1 auto; min-width:120px;
  }
  .stat b{ font-family:var(--font-mono); font-size:19px; font-variant-numeric:tabular-nums; }
  .stat span{ font-size:12px; color:var(--text-muted); }
  .stat.accent b{ color:var(--accent); }
  .stat.warn b{ color:var(--warn); }
  .stat.good b{ color:var(--good); }
  .stat-badge{
    font-family:var(--font-mono); font-size:10.5px; font-weight:700; letter-spacing:0.02em;
    padding:1px 6px; border-radius:999px; background:var(--danger-soft); color:var(--danger);
    margin-left:auto; flex:none;
  }
  .stat.clickable{ cursor:pointer; }
  .stat.clickable:hover{ border-color:var(--good); }
  .stat.clickable:active{ filter:brightness(0.97); }

  /* ---- day strip ---- */
  .daystrip{ display:flex; gap:6px; }
  .day-dot{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer; padding:4px 2px 2px; border-radius:10px;
    font-family:var(--font-mono); color:var(--text-faint);
  }
  .day-dot:hover{ background:var(--surface-2); }
  .day-dot .lbl{ font-size:10.5px; letter-spacing:0.03em; }
  .day-dot .dot{ width:9px; height:9px; border-radius:50%; background:var(--border); }
  .day-dot .dot.clear{ background:var(--good); }
  .day-dot .dot.pending{ background:var(--warn); }
  /* The highlighted dot tracks whatever day is currently in focus: Today
     while on the Today tab, or whichever day History is browsing to while
     on the History tab — not tied to a fixed "today" or a stale default. */
  .day-dot.is-selected{ background:var(--accent-soft); }
  .day-dot.is-selected .lbl{ color:var(--accent); font-weight:600; }
  .day-dot.is-future{ opacity:0.4; cursor:default; }
  .day-dot.is-future:hover{ background:none; }

  /* ---- composer ---- */
  .composer{
    display:flex; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:6px 6px 6px 8px; box-shadow:var(--shadow);
    align-items:center;
  }
  .composer input[type="text"]{
    flex:1; border:none; background:none; outline:none; font-family:var(--font-body);
    font-size:15px; color:var(--text); padding:10px 0;
  }
  .composer input[type="text"]::placeholder{ color:var(--text-faint); }
  .composer button.add{
    border:none; background:var(--accent); color:var(--accent-ink); font-family:var(--font-body);
    font-weight:600; font-size:14px; border-radius:9px; padding:0 18px; cursor:pointer;
  }
  .composer button.add:disabled{ opacity:0.4; cursor:default; }
  .composer button.add:not(:disabled):hover{ filter:brightness(1.06); }

  /* ---- priority ---- */
  .pri-pick{
    flex:none; display:flex; align-items:center; gap:5px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); font-family:var(--font-body);
    font-weight:600; font-size:12.5px; border-radius:9px; padding:0 10px; height:34px; cursor:pointer;
  }
  .pri-pick:hover{ background:var(--border); }
  .pri-pick .pri-dot{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); flex:none; }
  .pri-pick[data-pri="high"] .pri-dot{ background:var(--danger); }
  .pri-pick[data-pri="low"] .pri-dot{ background:var(--text-faint); }
  .pri-pick[data-pri="medium"] .pri-dot{ background:var(--medium); }
  .badge.pri-high{ background:var(--danger-soft); color:var(--danger); }
  .badge.pri-low{ background:var(--surface-2); color:var(--text-faint); }
  .badge.pri-medium{ background:var(--medium-soft); color:var(--medium); }
  .pri-cycle{
    border:none; background:none; cursor:pointer; padding:5px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  }
  .pri-cycle:hover{ background:var(--surface-2); color:var(--text); }
  .pri-cycle .pri-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-faint); }
  .pri-cycle[data-pri="high"] .pri-dot{ background:var(--danger); }
  .pri-cycle[data-pri="low"] .pri-dot{ background:var(--text-faint); border:1.5px solid var(--border); }
  .pri-cycle[data-pri="medium"] .pri-dot{ background:var(--medium); }
  li.task.pri-high{ box-shadow:inset 3px 0 0 var(--danger), var(--shadow); }

  /* ---- inline edit ---- */
  .edit-input{
    width:100%; border:1px solid var(--accent); border-radius:8px; background:var(--surface);
    color:var(--text); font-family:var(--font-body); font-size:15px; padding:6px 8px; outline:none;
  }
  .icon-btn.save:hover{ background:var(--good-soft); color:var(--good); }
  .icon-btn.cancel:hover{ background:var(--danger-soft); color:var(--danger); }

  /* ---- comment ---- */
  .comment-wrap{ margin-top:2px; }
  .comment-text{
    font-size:12.5px; color:var(--text-muted); line-height:1.4; cursor:pointer;
    white-space:pre-wrap; word-wrap:break-word; padding:2px 0;
  }
  .comment-text:hover{ color:var(--text); }
  .comment-input{
    width:100%; min-height:52px; resize:vertical; border:1px solid var(--accent); border-radius:8px;
    background:var(--surface); color:var(--text); font-family:var(--font-body); font-size:13px;
    padding:8px 10px; outline:none; margin-top:2px;
  }
  .comment-input::placeholder{ color:var(--text-faint); }
  .icon-btn.comment-btn.has{ color:var(--accent); }

  /* ---- tabs ---- */
  .tabs{
    display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:11px;
    width:fit-content; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    border:none; background:none; font-family:var(--font-body); font-weight:600; font-size:13.5px;
    color:var(--text-muted); padding:7px 14px; border-radius:8px; cursor:pointer; white-space:nowrap; flex:none;
  }
  .tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  /* ---- board switch ---- */
  .board-switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .board-tab{
    display:flex; align-items:center; border:1px solid var(--border); background:var(--surface);
    border-radius:999px; box-shadow:var(--shadow); max-width:220px; padding-right:3px;
  }
  .board-tab.active{ background:var(--accent-soft); border-color:transparent; }
  .board-tab-main{
    display:flex; align-items:center; gap:6px; min-width:0; border:none; background:none; cursor:pointer;
    color:var(--text-muted); font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:7px 8px 7px 10px; border-radius:999px;
  }
  .board-tab.active .board-tab-main{ color:var(--accent); }
  .board-tab .board-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .board-tab .board-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board-tab .count{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); flex:none; }
  .board-tab.active .count{ color:var(--accent); opacity:0.75; }
  .board-rename-btn{
    flex:none; border:none; background:none; color:var(--text-faint); cursor:pointer; padding:5px;
    border-radius:7px; display:flex; align-items:center; justify-content:center;
  }
  .board-rename-btn:hover{ background:var(--surface-2); color:var(--text); }
  .board-rename-btn svg{ width:12px; height:12px; flex-shrink:0; }
  .board-delete-btn{
    flex:none; border:none; background:none; color:var(--text-faint); cursor:pointer; padding:5px;
    border-radius:7px; display:flex; align-items:center; justify-content:center;
  }
  .board-delete-btn:hover{ background:var(--danger-soft); color:var(--danger); }
  .board-delete-btn svg{ width:12px; height:12px; flex-shrink:0; }
  .board-add-btn{
    flex:none; display:flex; align-items:center; justify-content:center; width:32px; height:32px;
    border-radius:999px; border:1px dashed var(--border); background:none; color:var(--text-faint); cursor:pointer;
  }
  .board-add-btn:hover{ background:var(--surface-2); color:var(--text); border-style:solid; }
  .board-add-btn svg{ width:16px; height:16px; flex-shrink:0; }
  .board-new-input, .board-rename-input{
    border:1px solid var(--accent); border-radius:999px; background:var(--surface); color:var(--text);
    font-family:var(--font-body); font-size:13px; padding:7px 14px; outline:none; width:150px;
  }
  .board-rename-input{ font-weight:600; }
  .board-new-input::placeholder{ color:var(--text-faint); }

  /* ---- lists ---- */
  section.pane{ display:flex; flex-direction:column; gap:10px; }
  .group-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); margin:6px 2px 0;
  }
  .group-label-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .group-label-row .group-label{ margin:6px 0 0; }
  .group-actions{ display:flex; align-items:center; gap:12px; }
  .reset-sort-link{
    border:none; background:none; color:var(--accent); font-family:var(--font-body); font-weight:600;
    font-size:11.5px; cursor:pointer; padding:2px 0; margin-top:4px;
  }
  .reset-sort-link:hover{ text-decoration:underline; }
  .move-trigger{
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
    font-family:var(--font-body); font-weight:600; font-size:11.5px; border-radius:999px;
    padding:4px 11px; cursor:pointer; margin-top:2px;
  }
  .move-trigger:hover:not(:disabled){ filter:brightness(1.06); }
  .move-trigger:disabled{ opacity:0.4; cursor:default; }
  ul.tasklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li.task{
    display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; box-shadow:var(--shadow);
  }
  li.task.carried{ background:var(--warn-soft); border-color:transparent; }
  li.task.done{ background:var(--surface-2); box-shadow:none; }
  li.task[draggable="true"]{ cursor:grab; }
  li.task.dragging{ opacity:0.45; }
  li.task.drag-over{ outline:2px dashed var(--accent); outline-offset:2px; }
  li.task.row-selected{ background:var(--accent-soft); border-color:var(--accent); }
  .drag-handle{
    flex:none; display:flex; align-items:center; justify-content:center; width:16px; height:23px;
    color:var(--text-faint); cursor:grab; margin-top:1px;
  }
  .drag-handle svg{ width:14px; height:14px; }
  .select-checkbox{
    flex:none; width:20px; height:20px; border-radius:6px; border:1.8px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:transparent; margin-top:1px;
  }
  .select-checkbox:hover{ border-color:var(--accent); }
  .select-checkbox.checked{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .select-checkbox svg{ width:13px; height:13px; display:block; flex-shrink:0; }
  .check{
    flex:none; width:23px; height:23px; border-radius:7px; border:1.8px solid var(--good);
    background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--good); margin-top:1px;
  }
  .check:hover{ border-color:var(--accent); }
  li.task.done .check{ background:var(--good); border-color:var(--good); color:#fff; }
  .check svg{ width:17px; height:17px; display:block; flex-shrink:0; }
  .task-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .task-text{ font-size:15px; line-height:1.4; word-wrap:break-word; }
  li.task.done .task-text{ color:var(--text-muted); text-decoration:line-through; text-decoration-color:var(--text-faint); }
  .task-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.02em; padding:2px 7px;
    border-radius:999px; background:var(--surface-2); color:var(--text-muted);
  }
  .badge.carry{ background:rgba(180,116,14,0.15); color:var(--warn); }
  .task-actions{ flex:none; display:flex; gap:4px; align-items:center; }
  .icon-btn{
    border:none; background:none; color:var(--text-faint); cursor:pointer; padding:5px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }
  .icon-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .empty{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    padding:44px 20px; color:var(--text-muted); background:var(--surface); border:1px dashed var(--border);
    border-radius:var(--radius);
  }
  .empty svg{ width:34px; height:34px; color:var(--text-faint); }
  .empty b{ color:var(--text); font-size:15px; }
  .empty span{ font-size:13px; max-width:32ch; }

  /* ---- history controls ---- */
  .history-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .history-head input[type="date"]{
    font-family:var(--font-mono); font-size:13px; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:9px; padding:7px 10px;
  }
  .history-nav{ display:flex; gap:4px; }
  .history-nav button{
    border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:8px;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .history-nav button:hover{ background:var(--surface-2); }
  .history-nav button:disabled{ opacity:0.35; cursor:default; }

  /* ---- weekly review ---- */
  .review-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .review-range{ display:flex; flex-direction:column; gap:2px; }
  .review-range b{ font-family:var(--font-display); font-size:17px; font-weight:600; }
  .review-range span{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); }
  .review-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
  }
  .review-notes{
    width:100%; min-height:72px; resize:vertical; border:1px solid var(--border); border-radius:10px;
    background:var(--surface-2); color:var(--text); font-family:var(--font-body); font-size:13.5px;
    padding:10px 12px; outline:none;
  }
  .review-notes:focus{ border-color:var(--accent); }
  .review-notes::placeholder{ color:var(--text-faint); }
  .review-mark{
    align-self:flex-start; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-family:var(--font-body); font-weight:600; font-size:13px; border-radius:9px; padding:8px 14px;
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .review-mark:hover{ background:var(--border); }
  .review-mark.done{ background:var(--good-soft); color:var(--good); border-color:transparent; }
  .review-mark svg{ width:14px; height:14px; flex-shrink:0; }

  /* ---- monthly calendar ---- */
  .cal-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px; box-shadow:var(--shadow);
  }
  .cal-dow-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px; }
  .cal-dow-row span{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-faint); text-align:center;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell{
    aspect-ratio:1/1; min-height:42px; display:flex; flex-direction:column; align-items:center;
    gap:2px; padding:4px 1px 3px; border:1px solid transparent; border-radius:9px;
    background:var(--surface-2); cursor:pointer; font-family:var(--font-body); position:relative;
  }
  .cal-cell:hover{ border-color:var(--border); }
  .cal-cell.cal-empty{ background:none; cursor:default; pointer-events:none; }
  .cal-cell.cal-today{ border-color:var(--accent); }
  .cal-cell.cal-today .cal-daynum{ color:var(--accent); font-weight:700; }
  .cal-cell.cal-selected{ background:var(--accent-soft); border-color:var(--accent); }
  .cal-daynum{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); line-height:1; }
  .cal-high-dot{ position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--danger); }
  .cal-counts{ display:flex; gap:3px; flex-wrap:wrap; justify-content:center; margin-top:auto; }
  .cal-count{
    font-family:var(--font-mono); font-size:10px; font-weight:700; line-height:1.4;
    min-width:15px; text-align:center; padding:0 4px; border-radius:999px;
  }
  .cal-count.done{ background:var(--good-soft); color:var(--good); }
  .cal-count.open{ background:var(--warn-soft); color:var(--warn); }

  .status-banner{
    font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border-radius:9px;
    padding:8px 12px; text-align:center;

  footer.note{ font-size:12px; color:var(--text-faint); text-align:center; padding-top:6px; }

  @media (max-width:420px){
    .brand h1{ font-size:25px; }
    .stat{ min-width:100px; }
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,21,0.45); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:340px; width:100%; padding:20px; display:flex;
    flex-direction:column; gap:14px;
  }
  .modal-title{ font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text); }
  .modal-body{ font-size:13.5px; color:var(--text-muted); line-height:1.5; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-btn{
    border:none; border-radius:9px; padding:9px 16px; font-family:var(--font-body); font-weight:600;
    font-size:13.5px; cursor:pointer;
  }
  .modal-btn.cancel{ background:var(--surface-2); color:var(--text); }
  .modal-btn.cancel:hover{ background:var(--border); }
  .modal-btn.confirm-danger{ background:var(--danger); color:#fff; }
  .modal-btn.confirm-danger:hover{ filter:brightness(1.08); }

  .priority-menu{
    position:fixed; width:132px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; box-shadow:var(--shadow); padding:4px; z-index:50;
    display:flex; flex-direction:column; gap:1px;
  }
  .priority-menu-item{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:7px; border:none;
    background:none; cursor:pointer; font-family:var(--font-body); font-size:13px; color:var(--text);
    text-align:left; width:100%;
  }
  .priority-menu-item:hover{ background:var(--surface-2); }
  .priority-menu-item.active{ font-weight:600; background:var(--surface-2); }
  .priority-menu-item .pri-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .priority-menu-item[data-pri="high"] .pri-dot{ background:var(--danger); }
  .priority-menu-item[data-pri="medium"] .pri-dot{ background:var(--medium); }
  .priority-menu-item[data-pri="low"] .pri-dot{ background:var(--text-faint); }
  .priority-menu-item .check-mark{ margin-left:auto; width:12px; height:12px; flex:none; color:var(--accent); }

  .board-move-menu{
    position:fixed; width:190px; max-height:260px; overflow-y:auto; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:4px; z-index:50;
    display:flex; flex-direction:column; gap:1px;

  .board-move-item{

    background:none; cursor:pointer; font-family:var(--font-body); font-size:13px; color:var(--text);
    text-align:left; width:100%;
  }
  .board-move-item:hover{ background:var(--surface-2); }
  .board-move-item .board-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .board-move-item .board-move-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board-move-empty{ font-size:12.5px; color:var(--text-faint); padding:8px 9px; }
</style>

<script>
(function(){
  "use strict";

  // ---------- date helpers (local calendar day, not UTC) ----------
  function toLocalStr(d){
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0,10);
  }
  function todayStr(){ return toLocalStr(new Date()); }
  function dayOffset(dateStr, delta){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return toLocalStr(d);
  }
  function daysBetween(a, b){
    return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000);
  }
  var WEEKDAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtLong(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    return WEEKDAY[d.getDay()] + ", " + MONTH[d.getMonth()] + " " + d.getDate();
  }
  function fmtShort(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    return MONTH[d.getMonth()] + " " + d.getDate();
  }
  // Monday-start week containing dateStr, as its Monday's date string.
  function weekStartOf(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    var dow = d.getDay(); // 0=Sun..6=Sat
    var back = dow === 0 ? 6 : dow - 1;
    d.setDate(d.getDate() - back);
    return toLocalStr(d);
  }
  // Calendar month containing dateStr, as that month's 1st day.
  function monthStartOf(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    return toLocalStr(new Date(d.getFullYear(), d.getMonth(), 1));
  }
  function monthEndOf(monthStart){
    var d = new Date(monthStart + "T00:00:00");
    return toLocalStr(new Date(d.getFullYear(), d.getMonth() + 1, 0)); // day 0 of next month = last day of this one
  }
  function nextMonthStart(monthStart){
    var d = new Date(monthStart + "T00:00:00");
    return toLocalStr(new Date(d.getFullYear(), d.getMonth() + 1, 1));
  }
  function prevMonthStart(monthStart){
    var d = new Date(monthStart + "T00:00:00");
    return toLocalStr(new Date(d.getFullYear(), d.getMonth() - 1, 1));
  }
  function fmtMonthLabel(monthStart){
    var d = new Date(monthStart + "T00:00:00");
    return MONTH[d.getMonth()] + " " + d.getFullYear();
  }

  var TODAY = todayStr();
  document.getElementById("todayLabel").textContent = fmtLong(TODAY);
  // History is a log of past days only — today's tasks live on the Today
  // tab, so History never goes past yesterday.
  var histMaxDay = dayOffset(TODAY, -1);

  var histDateInput = document.getElementById("histDate");
  histDateInput.max = histMaxDay;
  histDateInput.value = histMaxDay;

  var THIS_WEEK_START = weekStartOf(TODAY);
  var reviewWeekStart = THIS_WEEK_START;
  var THIS_MONTH_START = monthStartOf(TODAY);
  var reviewMonthStart = THIS_MONTH_START;

  // ---------- boards ----------
  // Boards are fully user-defined (created via the + button) — Today,
  // History and Review are all scoped to whichever board is selected.
  var boards = [];              // {id, name, createdAt, order}
  var boardsCol = null;         // CollectionReference, under this viewer's private data/users/<id>/ path
  var currentBoard = null;      // selected board id
  var defaultBoardAttempted = false;
  var boardFormOpen = false;
  var renamingBoardId = null;
  var confirmModal = null; // {title, message, confirmLabel, onConfirm} — drives the popup confirm dialog
  var priorityMenuTarget = null; // {kind:"composer"|"task", id, top, left} — drives the priority picker popup
  var activeTab = "today"; // "today"|"history"|"completed"|"review"|"monthReview" — which day-strip dot gets highlighted
  var selectMode = false; // Today tab's open-task list: multi-select mode for bulk-moving tasks to another board
  var selectedTaskIds = {}; // {taskId: true} — which open tasks are checked while selectMode is on
  var boardMoveMenuTarget = null; // {top, left} — drives the "move to board" popup
  var BOARD_PALETTE = ["var(--accent)", "var(--personal)", "var(--warn)", "var(--danger)", "var(--good)"];

  function boardIndex(id){
    for (var i = 0; i < boards.length; i++){ if (boards[i].id === id) return i; }
    return 0;
  }
  function boardColor(id){ return BOARD_PALETTE[boardIndex(id) % BOARD_PALETTE.length]; }
  // Resolves a task's stored board id to a real board — tasks created
  // before a matching board existed (or whose board was removed) fall
  // back to the oldest board rather than disappearing.
  function normalizeBoard(id){
    if (boards.some(function(b){ return b.id === id; })) return id;
    return boards.length ? boards[0].id : null;
  }
  function sortBoards(list){
    return list.sort(function(a,b){ return (a.order - b.order) || (a.createdAt - b.createdAt); });
  }
  function ensureDefaultBoard(){
    if (boards.length || defaultBoardAttempted) return;
    defaultBoardAttempted = true;
    createBoard("Tasks");
  }
  function resolveCurrentBoard(){
    if (currentBoard && boards.some(function(b){ return b.id === currentBoard; })) return;
    var saved = null;
    try { saved = localStorage.getItem("rollover_board_v1"); } catch(e){}
    if (saved && boards.some(function(b){ return b.id === saved; })){ currentBoard = saved; return; }
    currentBoard = boards.length ? boards[0].id : null;
  }
  function switchBoard(id){
    if (id === currentBoard) return;
    commitOpenComment();
    currentBoard = id;
    try { localStorage.setItem("rollover_board_v1", id); } catch(e){}
    editingTaskId = null;
    openCommentId = null;
    boardFormOpen = false;
    renamingBoardId = null;
    closeConfirm();
    priorityMenuTarget = null;
    selectMode = false;
    selectedTaskIds = {};
    boardMoveMenuTarget = null;
    render();
  }
  async function createBoard(name){
    name = (name || "").trim();
    if (!name) return;
    if (backend === "db"){
      var ref = await boardsCol.add({ name: name, createdAt: Date.now(), order: boards.length });
      switchBoard(ref.id);
    } else {
      var id = genId();
      boards.push({ id: id, name: name, createdAt: Date.now(), order: boards.length });
      sortBoards(boards);
      localSave("rollover_boards_v1", boards);
      switchBoard(id);
    }
  }
  async function renameBoard(id, name){
    if (backend === "db"){
      await boardsCol.doc(id).update({ name: name });
    } else {
      var b = boards.find(function(x){ return x.id === id; });
      if (b){ b.name = name; localSave("rollover_boards_v1", boards); }
      render();
    }
  }
  function commitRename(id, value){
    var name = (value || "").trim();
    renamingBoardId = null;
    if (name) renameBoard(id, name); else render();
  }
  // Deletes a board along with every task and review note filed under it.
  // If this was the last board, a fresh default one is created right after
  // so the composer always has somewhere to add to.
  async function deleteBoard(id){
    defaultBoardAttempted = false; // allow a new default board if this was the only one
    if (backend === "db"){
      var tasksSnap = await col.where("board", "==", id).get();
      var reviewsSnap = await reviewCol.where("board", "==", id).get();
      var deletes = [];
      tasksSnap.docs.forEach(function(d){ deletes.push(col.doc(d.id).delete()); });
      reviewsSnap.docs.forEach(function(d){ deletes.push(reviewCol.doc(d.id).delete()); });
      deletes.push(boardsCol.doc(id).delete());
      await Promise.all(deletes);
      // boardsCol.onSnapshot picks this up and handles default-board
      // recreation + currentBoard resolution + re-render on its own.
    } else {
      tasks = tasks.filter(function(t){ return t.board !== id; });
      reviews = reviews.filter(function(r){ return r.board !== id; });
      boards = boards.filter(function(b){ return b.id !== id; });
      localSave("rollover_tasks_v1", tasks);
      localSave("rollover_reviews_v1", reviews);
      localSave("rollover_boards_v1", boards);
      if (currentBoard === id){
        currentBoard = null;
        ensureDefaultBoard();
        resolveCurrentBoard();
      }
      editingTaskId = null;
      openCommentId = null;
      selectMode = false;
      selectedTaskIds = {};
      boardMoveMenuTarget = null;
      render();
    }
  }
  function onBoardsChanged(list){
    boards = sortBoards(list);
    ensureDefaultBoard();
    resolveCurrentBoard();
    render();
  }

  // ---------- priority ----------
  // "normal" was the old middle-tier key; normalizePriority() below now
  // falls back to "low" for it, so tasks saved before this rename show as
  // Low instead of silently losing their priority.
  var PRIORITY_ORDER = ["low","medium","high"];
  var PRIORITY_LABEL = { low:"Low", medium:"Medium", high:"High" };
  var PRIORITY_RANK = { high:0, medium:1, low:2 };
  function normalizePriority(p){ return PRIORITY_LABEL[p] ? p : "low"; }

  var composerPriority = "low";
  var priPickEl = document.getElementById("priPick");
  var priPickLabelEl = document.getElementById("priPickLabel");
  function renderPriPick(){
    priPickEl.setAttribute("data-pri", composerPriority);
    priPickLabelEl.textContent = PRIORITY_LABEL[composerPriority];
  }
  priPickEl.addEventListener("mousedown", function(e){
    e.preventDefault();
    if (priorityMenuTarget && priorityMenuTarget.kind === "composer"){ closePriorityMenu(); }
    else { openPriorityMenu("composer", null, priPickEl); }
  });
  renderPriPick();

  // ---------- inline text edit ----------
  var editingTaskId = null;
  function focusEditInputIfNeeded(){
    if (!editingTaskId) return;
    var el = document.querySelector('.edit-input[data-id="' + editingTaskId + '"]');
    if (el){ el.focus(); el.select(); }
  }

  // ---------- comment box ----------
  var openCommentId = null;
  function focusCommentInputIfNeeded(){
    if (!openCommentId) return;
    var el = document.querySelector('.comment-input[data-id="' + openCommentId + '"]');
    if (el){ el.focus(); var len = el.value.length; el.setSelectionRange(len, len); }
  }

  // ---------- storage backend: db capability, falling back to localStorage ----------
  var tasks = [];               // in-memory mirror, array of {id, text, status, priority, comment, createdDate, doneDate, createdAt}
  var reviews = [];             // in-memory mirror, array of {id (=weekStart), notes, reviewedAt}
  var backend = null;           // 'db' | 'local'
  var col = null;                // CollectionReference for tasks, under this viewer's private data/users/<id>/ path
  var reviewCol = null;          // CollectionReference for reviews, same private path

  function setBanner(msg){
    var el = document.getElementById("statusBanner");
    if (!msg){ el.style.display = "none"; return; }
    el.textContent = msg; el.style.display = "block";
  }

  function localLoad(key){
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function localSave(key, list){
    try { localStorage.setItem(key, JSON.stringify(list)); } catch(e){}
  }

  function render(){ renderBoardSwitch(); renderStats(); renderStrip(); renderToday(); renderHistory(); renderCompleted(); renderReview(); renderMonthReview(); renderModal(); renderPriorityMenu(); renderBoardMoveMenu(); focusEditInputIfNeeded(); focusCommentInputIfNeeded(); }

  // ---------- confirm modal ----------
  // A custom in-page popup (not window.confirm, which sandboxed artifact
  // iframes can block) used for single-click destructive-action confirms.
  function openConfirm(opts){
    confirmModal = opts;
    renderModal();
  }
  function closeConfirm(){
    if (!confirmModal) return;
    confirmModal = null;
    renderModal();
  }
  function renderModal(){
    var root = document.getElementById("modalRoot");
    if (!root) return;
    root.innerHTML = "";
    if (!confirmModal) return;
    var modal = confirmModal;
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.onclick = function(e){ if (e.target === overlay) closeConfirm(); };
    var card = document.createElement("div");
    card.className = "modal-card";
    var title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = modal.title;
    card.appendChild(title);
    var body = document.createElement("div");
    body.className = "modal-body";
    body.textContent = modal.message;
    card.appendChild(body);
    var actions = document.createElement("div");
    actions.className = "modal-actions";
    var cancelBtn = document.createElement("button");
    cancelBtn.className = "modal-btn cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.onclick = function(){ closeConfirm(); };
    actions.appendChild(cancelBtn);
    var confirmBtn = document.createElement("button");
    confirmBtn.className = "modal-btn confirm-danger";
    confirmBtn.textContent = modal.confirmLabel || "Yes, delete";
    confirmBtn.onclick = function(){
      var action = modal.onConfirm;
      closeConfirm();
      if (action) action();
    };
    actions.appendChild(confirmBtn);
    card.appendChild(actions);
    overlay.appendChild(card);
    root.appendChild(overlay);
    setTimeout(function(){ confirmBtn.focus(); }, 0);
  }
  document.addEventListener("keydown", function(e){
    if (confirmModal && e.key === "Escape"){ e.preventDefault(); closeConfirm(); }
    if (priorityMenuTarget && e.key === "Escape"){ e.preventDefault(); closePriorityMenu(); }
    if (boardMoveMenuTarget && e.key === "Escape"){ e.preventDefault(); closeBoardMoveMenu(); }
    if (selectMode && !boardMoveMenuTarget && e.key === "Escape"){ e.preventDefault(); toggleSelectMode(); }
  });

  // ---------- priority picker popup ----------
  // Clicking a priority dot opens a small popup listing High/Medium/Low so
  // the person can jump straight to one, instead of clicking repeatedly to
  // cycle through them. Position is computed once at open time from the
  // trigger button's own rect (position:fixed, so no scroll-offset math
  // needed) and clamped so the popup never runs off the viewport.
  var PRIORITY_MENU_WIDTH = 132;
  function openPriorityMenu(kind, id, anchorEl){
    var rect = anchorEl.getBoundingClientRect();
    var estHeight = 3 * 33 + 8; // three rows plus padding
    var left = Math.min(rect.left, window.innerWidth - PRIORITY_MENU_WIDTH - 8);
    left = Math.max(8, left);
    var top;
    if (rect.bottom + estHeight + 8 <= window.innerHeight){
      top = rect.bottom + 6;
    } else {
      top = Math.max(8, rect.top - estHeight - 6);
    }
    priorityMenuTarget = { kind: kind, id: id, top: top, left: left };
    renderPriorityMenu();
  }
  function closePriorityMenu(){

  var BOARD_MOVE_MENU_WIDTH = 190;
  function openBoardMoveMenu(anchorEl){
    if (!selectedCount()) return;
    var otherCount = boards.filter(function(b){ return b.id !== currentBoard; }).length;
    var rect = anchorEl.getBoundingClientRect();
    var estHeight = Math.max(1, Math.min(otherCount, 6)) * 33 + 8;
    var left = Math.min(rect.left, window.innerWidth - BOARD_MOVE_MENU_WIDTH - 8);
    left = Math.max(8, left);
    var top;
    if (rect.bottom + estHeight + 8 <= window.innerHeight){
      top = rect.bottom + 6;
    } else {
      top = Math.max(8, rect.top - estHeight - 6);

  // Moves every currently-checked task to `targetBoardId` in one batch,

  async function moveSelectedTasksToBoard(targetBoardId){

  // The artifact runs in a sandboxed iframe where a plain `blur` on a text
  // field doesn't reliably fire for every "click somewhere else" interaction,
  // so every open, unsaved text field here is also flushed by this
  // capture-phase pointerdown listener. Capture means it runs before any
  // click handler elsewhere (switching boards, opening another task's note,
  // etc.) gets a chance to re-render and silently discard what's still typed.
  document.addEventListener("pointerdown", function(e){
    // A click on a task's own note-toggle button is left entirely to
    // toggleComment() below — it already knows whether that's "close this
    // one" or "switch to a different task's note" and handles saving either
    // way; flushing here too would race it and could make the box pop back
    // open right after this same click closes it.
    if (openCommentId && !e.target.closest(".comment-btn")){
      var commentEl = document.querySelector('.comment-input[data-id="' + openCommentId + '"]');
      if (commentEl && !commentEl.contains(e.target)){
        updateTaskComment(openCommentId, commentEl.value);
        openCommentId = null;
        render();
      }
    }
    if (editingTaskId && !e.target.closest(".icon-btn.save") && !e.target.closest(".icon-btn.cancel")){
      var editEl = document.querySelector('.edit-input[data-id="' + editingTaskId + '"]');
      if (editEl && !editEl.contains(e.target)) commitEdit(editingTaskId, editEl.value);
    }
    if (renamingBoardId){
      var renameEl = document.querySelector(".board-rename-input");
      if (renameEl && !renameEl.contains(e.target)) commitRename(renamingBoardId, renameEl.value);
    }
    if (boardFormOpen){
      var boardEl = document.querySelector(".board-new-input");
      if (boardEl && !boardEl.contains(e.target)) commitNewBoard(boardEl.value);
    }
    // A click on a priority dot is left to its own mousedown handler below
    // (it toggles the popup); anything else outside the open popup closes it.
    if (priorityMenuTarget && !e.target.closest(".pri-pick") && !e.target.closest(".pri-cycle")){
      var menuEl = document.querySelector(".priority-menu");
      if (menuEl && !menuEl.contains(e.target)) closePriorityMenu();
    }
    // Same pattern for the "move to board" popup — its own trigger button
    // handles opening/toggling it, so only an outside click closes it here.
    if (boardMoveMenuTarget && !e.target.closest(".move-trigger")){
      var boardMenuEl = document.querySelector(".board-move-menu");
      if (boardMenuEl && !boardMenuEl.contains(e.target)) closeBoardMoveMenu();
    }
  }, true);

  // ---------- derived views ----------
  function priorityCompare(a, b){
    var ra = PRIORITY_RANK[normalizePriority(a.priority)];
    var rb = PRIORITY_RANK[normalizePriority(b.priority)];
    if (ra !== rb) return ra - rb;
    // Within the same priority, the most recently added task shows first.
    if (a.createdDate !== b.createdDate) return a.createdDate < b.createdDate ? 1 : -1;
    return b.createdAt - a.createdAt;
  }
  // Every view is scoped to the currently selected board — Official and
  // Personal are entirely separate task lists sharing one page.
  function tasksForBoard(board){
    var b = board || currentBoard;
    return tasks.filter(function(t){ return normalizeBoard(t.board) === b; });
  }
  function openCountForBoard(board){
    return tasksForBoard(board).filter(function(t){ return t.status === "open"; }).length;
  }
  function openTasksSorted(){
    // Tasks added today always sit above carried-over tasks from earlier
    // days; each of those two groups is then ordered by priority on its own —
    // unless this board has been switched into manual order (see the manual
    // task ordering section below), in which case each group keeps whatever
    // order was last set by hand instead.
    var open = tasksForBoard().filter(function(t){ return t.status === "open"; });
    var cmp = isManualOrder() ? manualOrderCompare : priorityCompare;
    var addedToday = open.filter(function(t){ return t.createdDate === TODAY; }).sort(cmp);
    var carriedOver = open.filter(function(t){ return t.createdDate !== TODAY; }).sort(cmp);
    return addedToday.concat(carriedOver);
  }
  function doneTodaySorted(){
    return tasksForBoard().filter(function(t){ return t.status === "done" && t.doneDate === TODAY; })
      .sort(function(a,b){ return b.createdAt - a.createdAt; });
  }
  function tasksOnDay(dateStr){
    return tasksForBoard().filter(function(t){
      // Tasks added today live on the Today tab; History is a log of past
      // days, so a brand-new task shouldn't also show up there, even when
      // History is browsed to today's own date.
      if (t.createdDate === TODAY) return false;
      if (t.createdDate > dateStr) return false;
      if (t.status === "open") return true;
      return t.doneDate && t.doneDate >= dateStr;
    }).sort(function(a,b){ return a.createdDate === b.createdDate ? (a.createdAt - b.createdAt) : (a.createdDate < b.createdDate ? -1 : 1); });
  }
  function dayHasOpenAt(dateStr){
    // true if, looking back at dateStr, anything created on/before it was still open at end of that day
    return tasksForBoard().some(function(t){
      if (t.createdDate > dateStr) return false;
      if (t.status === "open") return true;
      return t.doneDate && t.doneDate > dateStr;
    });
  }
  function dayHasAny(dateStr){
    return tasksForBoard().some(function(t){ return t.createdDate <= dateStr && (t.status === "open" || (t.doneDate && t.doneDate >= dateStr)); });
  }
  function tasksDoneInWeek(weekStart){
    var end = dayOffset(weekStart, 6);
    return tasksForBoard().filter(function(t){ return t.status === "done" && t.doneDate && t.doneDate >= weekStart && t.doneDate <= end; })
      .sort(priorityCompare);
  }
  function tasksStillOpenFromWeek(weekStart){
    var end = dayOffset(weekStart, 6);
    return tasksForBoard().filter(function(t){ return t.status === "open" && t.createdDate >= weekStart && t.createdDate <= end; })
      .sort(priorityCompare);
  }
  function tasksDoneInMonth(monthStart){
    var end = monthEndOf(monthStart);
    return tasksForBoard().filter(function(t){ return t.status === "done" && t.doneDate && t.doneDate >= monthStart && t.doneDate <= end; })
      .sort(priorityCompare);
  }
  function tasksStillOpenFromMonth(monthStart){
    var end = monthEndOf(monthStart);
    return tasksForBoard().filter(function(t){ return t.status === "open" && t.createdDate >= monthStart && t.createdDate <= end; })
      .sort(priorityCompare);
  }
  // Every completed task on this board, no matter when it was added or
  // finished — most recently completed first.
  function allDoneTasksSorted(){
    return tasksForBoard().filter(function(t){ return t.status === "done"; })
      .sort(function(a,b){
        var ad = a.doneDate || "", bd = b.doneDate || "";
        if (ad !== bd) return ad < bd ? 1 : -1;
        return b.createdAt - a.createdAt;
      });
  }

  // ---------- manual task ordering ----------
  // Open tasks sort by priority by default, same as always. Moving one with
  // the up/down buttons, or by dragging it, switches that board into "manual
  // order" mode: from then on each open-task group (today-added, or carried-
  // over — the same two groups openTasksSorted() always keeps separate) is
  // ordered exactly the way it was last left, instead of being recomputed by
  // priority. A "Reset to priority sort" control switches a board back.
  function isManualOrder(){
    var b = boards.find(function(x){ return x.id === currentBoard; });
    return !!(b && b.manualSort);
  }
  // A High or Medium task always sits above its Low-priority siblings in
  // this group, no matter when that priority was set or how long ago the
  // group was last dragged — High above Medium, both above every Low task.
  // Only within a tier (high-vs-high, medium-vs-medium, or among the Lows)
  // does manualOrder — then createdAt — break the tie, which is what lets
  // a drag still reorder tasks that share a tier. Because this is the live
  // comparator behind every manual-order render rather than a one-time move
  // applied when a priority changes, a task that already had High or Medium
  // priority before this behavior existed floats to the top the moment the
  // page next renders — no re-save or migration of existing tasks needed.
  function manualOrderCompare(a, b){
    var pa = normalizePriority(a.priority), pb = normalizePriority(b.priority);
    var pinnedA = pa === "high" || pa === "medium";
    var pinnedB = pb === "high" || pb === "medium";
    if (pinnedA !== pinnedB) return pinnedA ? -1 : 1;
    if (pinnedA && pinnedB && pa !== pb) return PRIORITY_RANK[pa] - PRIORITY_RANK[pb];
    var oa = typeof a.manualOrder === "number" ? a.manualOrder : 0;
    var ob = typeof b.manualOrder === "number" ? b.manualOrder : 0;
    if (oa !== ob) return oa - ob;
    return a.createdAt - b.createdAt; // stable tiebreaker for never-ordered tasks
  }
  async function setBoardManualSort(value){
    if (backend === "db"){
      await boardsCol.doc(currentBoard).update({ manualSort: value });
    } else {
      var b = boards.find(function(x){ return x.id === currentBoard; });
      if (b) b.manualSort = value;
    }
  }
  async function writeTaskOrders(list){ // [{id, manualOrder}]
    if (backend === "db"){
      await Promise.all(list.map(function(x){ return col.doc(x.id).update({ manualOrder: x.manualOrder }); }));
    } else {
      list.forEach(function(x){
        var t = tasks.find(function(y){ return y.id === x.id; });
        if (t) t.manualOrder = x.manualOrder;
      });
      localSave("rollover_boards_v1", boards);
      localSave("rollover_tasks_v1", tasks);
      render();
    }
  }
  // The open-task group (today-added, or carried-over) `t` belongs to, in
  // whatever order is currently on screen for it — exactly what
  // openTasksSorted() would show for that group right now.
  function currentGroupOrder(t){
    var open = tasksForBoard().filter(function(x){ return x.status === "open" && (x.createdDate === TODAY) === (t.createdDate === TODAY); });
    return open.sort(isManualOrder() ? manualOrderCompare : priorityCompare);
  }
  async function commitGroupOrder(group){
    await setBoardManualSort(true);
    await writeTaskOrders(group.map(function(t, i){ return { id: t.id, manualOrder: i }; }));
  }
  var dragTaskId = null;
  function handleDragStart(id){ dragTaskId = id; }
  async function handleDrop(targetId){
    var draggedId = dragTaskId;
    dragTaskId = null;
    if (!draggedId || draggedId === targetId) return;
    var dragged = tasks.find(function(x){ return x.id === draggedId; });
    var target = tasks.find(function(x){ return x.id === targetId; });
    if (!dragged || !target) return;
    if ((dragged.createdDate === TODAY) !== (target.createdDate === TODAY)) return; // no cross-group drops
    var group = currentGroupOrder(dragged);
    var fromIdx = group.findIndex(function(x){ return x.id === draggedId; });
    var toIdx = group.findIndex(function(x){ return x.id === targetId; });
    if (fromIdx === -1 || toIdx === -1) return;
    group.splice(fromIdx, 1);
    group.splice(toIdx, 0, dragged);
    await commitGroupOrder(group);
  }
  async function resetManualOrder(){
    await setBoardManualSort(false);
    render();
  }

  // ---------- rendering ----------
  function checkSvg(){
    return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>';
  }
  function trashSvg(){

  function dragHandleSvg(){
    return '<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="7" cy="5" r="1.3"/><circle cx="13" cy="5" r="1.3"/><circle cx="7" cy="10" r="1.3"/><circle cx="13" cy="10" r="1.3"/><circle cx="7" cy="15" r="1.3"/><circle cx="13" cy="15" r="1.3"/></svg>';
